# Builds the dashboard in replay mode (no backend) and publishes it to GitHub Pages. The hosted
# demo plays back recorded runs of the real system, so it is a free, always-on static site.
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

# Permissions the Pages deploy action needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Build (replay mode, project-page base path)
        run: npm run build
        env:
          VITE_REPLAY: '1'
          VITE_BASE: /elo-arena-matchmaker/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
