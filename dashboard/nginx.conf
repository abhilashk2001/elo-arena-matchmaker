# nginx serves the built dashboard and proxies the backend paths to the app service, so the browser
# makes same-origin requests (mirrors the Vite dev proxy). "app" resolves on the compose network.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend read endpoints, REST API, actuator, and Swagger all go to the app container.
    location ~ ^/(dashboard|api|actuator|swagger-ui|v3/api-docs) {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static SPA. It is a single page, so fall back to index.html for any unknown path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
