# Local stack for Elo Arena Matchmaker.
# Postgres is the source of truth, Redis is the live read model, app is the API + matcher,
# dashboard is the nginx-served React ops view.
#
#   docker compose up                          → postgres, redis, app (api+matcher), dashboard
#   docker compose --profile matchers up --scale matcher=3
#                                              → plus N extra matcher-only instances for the
#                                                concurrent-matcher demo
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eloarena
      POSTGRES_USER: eloarena
      POSTGRES_PASSWORD: eloarena
    ports:
      # Host port 5433 to avoid clashing with a local Postgres on 5432.
      # The app inside compose still connects on the internal network at postgres:5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready reports when Postgres is actually accepting connections,
      # not merely that the container process has started.
      test: ["CMD-SHELL", "pg_isready -U eloarena -d eloarena"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      # Wait until Postgres and Redis pass their healthchecks before starting the app.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eloarena
      SPRING_DATASOURCE_USERNAME: eloarena
      SPRING_DATASOURCE_PASSWORD: eloarena
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # Seed 1,000 players on first boot so a clean `docker compose up` is immediately usable.
      # Idempotent: skipped when the players table already has rows (persistent pgdata volume).
      ELOARENA_SEED_ON_BOOT_ENABLED: "true"
      ELOARENA_SEED_ON_BOOT_COUNT: "1000"
    ports:
      - "8080:8080"

  # Extra matcher-only instances for the multi-matcher concurrency demo. Off by default; start with
  # `docker compose --profile matchers up --scale matcher=3`. Each runs the pairing loop and claims
  # disjoint batches via FOR UPDATE SKIP LOCKED, so the locking matcher's throughput scales while
  # anomalies stay at zero. No published port: these are internal workers.
  matcher:
    build: .
    profiles: ["matchers"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: matcher-only
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eloarena
      SPRING_DATASOURCE_USERNAME: eloarena
      SPRING_DATASOURCE_PASSWORD: eloarena
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

  dashboard:
    build: ./dashboard
    depends_on:
      - app
    ports:
      # Dashboard at http://localhost:3000. nginx proxies /api, /dashboard, /actuator, and
      # /swagger-ui to the app service on the compose network.
      - "3000:80"

volumes:
  pgdata:
