# Base configuration shared by every profile.
# Datasource and Redis connection settings are added in story #11 (Docker Compose),
# where they come from environment variables so the same image runs locally and in compose.
spring:
  application:
    name: elo-arena-matchmaker

  # Connection settings come from the environment so the same image runs locally
  # and in Docker Compose. The defaults point at localhost for running outside compose.
  # Integration tests override these via Testcontainers @ServiceConnection, so the
  # defaults here never affect tests.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/eloarena}
    username: ${SPRING_DATASOURCE_USERNAME:eloarena}
    password: ${SPRING_DATASOURCE_PASSWORD:eloarena}

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  jpa:
    # Flyway owns the schema. Hibernate must never create or alter tables.
    # 'validate' makes startup fail fast if an entity stops matching its Flyway table,
    # which catches drift between the migrations and the JPA mappings.
    hibernate:
      ddl-auto: validate
    # Keep the persistence context out of the view layer. Avoids lazy-loading
    # surprises and holding a DB connection for the whole request.
    open-in-view: false

  flyway:
    enabled: true

# Actuator: expose the operational endpoints the dashboard and benchmarks read later.
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always

# Application-specific settings live under this namespace.
# Individual keys are introduced by the stories that use them
# (matcher strategy in Phase 4, band expansion in Phase 2, and so on).
eloarena:
  # The active role of this instance. 'all' runs the API and the matcher together.
  # The matcher-only and api-only profiles override this.
  role: all

  matcher:
    # Active matching strategy at startup: locking (safe) or naive (the broken demo mode).
    # Switchable at runtime via PUT /api/admin/matcher-strategy.
    strategy: locking
    # Whether this instance runs the scheduled matcher loop. On for default and
    # matcher-only; the api-only profile turns it off.
    loop-enabled: true
    # How often the matcher loop runs, in milliseconds.
    interval-ms: 1000
    # How many waiting rows a locking matcher claims per tick. Small enough that other
    # matchers always have rows to claim, large enough to find good pairs within the batch.
    batch-size: 100
    # Band expansion: a waiting player's acceptable rating half-width starts at 'base'
    # and grows by 'expansion-per-second' each second, capped at 'max'.
    band:
      base: 50
      expansion-per-second: 5
      max: 400

  # In-app load simulator (Phase 7). It drives the application's own HTTP API, so base-url
  # points back at this instance. Override base-url when the API runs on another host or port.
  simulator:
    base-url: ${ELOARENA_SIMULATOR_BASE_URL:http://localhost:8080}
    poll-ms: 200
    max-polls: 300
